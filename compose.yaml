services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weatherfusion}
      POSTGRES_USER: ${POSTGRES_USER:-weatherfusion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weatherfusion}
    ports:
      - "55432:5432"
    volumes:
      - weatherfusion_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  weatherfusion_postgres:
